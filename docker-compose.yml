services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opsforge
      POSTGRES_PASSWORD: opsforge
      POSTGRES_DB: opsforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://opsforge:opsforge@postgres:5432/opsforge
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-4-5}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  n8n:
    image: n8nio/n8n:latest
    environment:
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: Asia/Kolkata
    ports:
      - "5678:5678"
    volumes:
      - n8ndata:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    depends_on:
      - backend

volumes:
  pgdata:
  n8ndata:
