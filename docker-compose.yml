name: opsforge

# A fixed network name, so cluster-up.sh can attach the kind node to it.
networks:
  default:
    name: opsforge-net

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opsforge
      POSTGRES_PASSWORD: opsforge
      POSTGRES_DB: opsforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates (or reuses) the local kind cluster, joins its node to this network
  # and writes kubeconfigs, then exits. Needs the host Docker socket because
  # kind runs the Kubernetes node as a sibling container.
  cluster-bootstrap:
    build: ./cluster
    environment:
      COMPOSE_NETWORK: opsforge-net
      INTERNAL_KUBECONFIG: /kube/config
      HOST_KUBECONFIG: /host-kube/config
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - kubeconfig:/kube
      - ./.kube:/host-kube
    restart: "no"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://opsforge:opsforge@postgres:5432/opsforge
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-opus-5}
      CLUSTER_MODE: ${CLUSTER_MODE:-kind}
      KUBECONFIG: /kube/config
      CLUSTER_NODE_HOST: opsforge-control-plane
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      # Demo timings: one compressed "day" of traffic every 5 minutes, so the
      # seasonal layer has its two days of history after 10. config.py holds
      # the defaults; production would run a 24h period.
      SEASONAL_PERIOD_S: ${SEASONAL_PERIOD_S:-300}
      LOADGEN_CYCLE_PERIOD_S: ${SEASONAL_PERIOD_S:-300}
    volumes:
      - kubeconfig:/kube:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      cluster-bootstrap:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  n8n:
    image: n8nio/n8n:latest
    environment:
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: Asia/Kolkata
    ports:
      - "5678:5678"
    volumes:
      - n8ndata:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    depends_on:
      - backend

volumes:
  pgdata:
  n8ndata:
  kubeconfig:
